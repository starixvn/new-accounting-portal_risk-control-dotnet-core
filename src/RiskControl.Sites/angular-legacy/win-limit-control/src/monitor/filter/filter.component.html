<div class="filter-container">
    <div class="row">
        <div class="col-nap col-nap-1">
            <div class="group-nap">
                <label>From Date</label>
                <div class="control-nap">
                    <nap-date-picker [(date)]="fromDate" [minDate]="minDate" [maxDate]="toDate"></nap-date-picker>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-2">
            <div class="group-nap">
                <label>To Date</label>
                <div class="control-nap">
                    <nap-date-picker [(date)]="toDate" [minDate]="fromDate" [maxDate]="maxDate"></nap-date-picker>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-3">
            <div class="group-nap">
                <label for="select-product">Product</label>
                <div class="control-nap">
                    <select class="form-control" id="select-product" [(ngModel)]="productId" (ngModelChange)="onProductChange()">
                        <option *ngFor="let product of products" [ngValue]="product.Id">
                            {{product.Name}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-4">
            <div class="group-nap">
                <label>Reached Limit Level</label>
                <div class="control-nap">
                    <ngx-dropdown-treeview [items]="limitLevels" (selectedChange)="onLimitLevelSelectedChange($event)"></ngx-dropdown-treeview>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-5 col-nap-exclude-test">
            <div class="d-inline-block">
                <div class="form-check">
                    <label class="form-check-label">
                        <input type="checkbox" class="form-check-input" [(ngModel)]="excludeTestData">
                        Exclude test data
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-nap col-nap-1">
            <div class="group-nap">
                <label>Username</label>
                <div class="control-nap">
                    <nap-dropdown-typeahead [query]="userNameTypeaheadQuery" [minLengthHasSuggestion]="3" [(text)]="userName"></nap-dropdown-typeahead>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-2">
            <div class="group-nap">
                <label>Site / Licensee</label>
                <div class="control-nap">
                    <nap-dropdown-treeview-select [items]="sites" [(value)]="siteId" (valueChange)="onSiteSelectedChange()"></nap-dropdown-treeview-select>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-3">
            <div class="group-nap">
                <label for="select-currency">Currency</label>
                <div class="control-nap">
                    <select class="form-control" id="select-currency" [(ngModel)]="currencyId">
                        <option *ngFor="let currency of currencies" [ngValue]="currency.Id">
                            {{currency.Name}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-4">
            <div class="group-nap">
                <label>Show Column</label>
                <div class="control-nap">
                    <ngx-dropdown-treeview class="treeview-button-ellipsis" [items]="columnTreeviewItems" (selectedChange)="onColumnChange($event)"></ngx-dropdown-treeview>
                </div>
            </div>
        </div>
        <div class="col-nap col-nap-5">
            <button type="button" class="btn btn-primary" (click)="search()">Search</button>
        </div>
    </div>
</div>
