<nap-navbar></nap-navbar>
<div class="container-fluid" style="min-width: 1250px; margin-top:50px">
  <div class="nap-header">
    <div class="title">
        <span class="active">Other Sport Bet Monitoring Alert Config</span>
    </div>
  </div>
  <div class="nap-filter">
    <div class="row">
      <div class="nap-col">
        <div class="nap-group">
          <label>Minimum Tickets</label>
          <div class="nap-control">
            <ngx-numeric-textbox [min]="25" [max]="32000" [decimals]="0" format="0,0" [autoCorrect]="false" [(ngModel)]="model.MinimumTickets">
            </ngx-numeric-textbox>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="nap-col">
        <div class="nap-group">
          <label>Threshold</label>
          <div class="nap-control">
            <ngx-numeric-textbox [min]="25" [max]="100" [decimals]="0" format="0,0" [autoCorrect]="false" [(ngModel)]="model.Threshold">
            </ngx-numeric-textbox>
          </div>
          <span>&nbsp;%</span>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="nap-col">
        <div class="nap-group">
          <label>&nbsp;</label>
          <div class="nap-control">
            <button type="button" class="btn btn-primary" (click)="save()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nap-toast></nap-toast>
</div>
<nap-spinner></nap-spinner>
