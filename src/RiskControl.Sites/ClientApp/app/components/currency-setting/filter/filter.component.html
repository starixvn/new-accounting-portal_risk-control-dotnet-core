<div class="nap-filter">
    <div class="row">
        <div class="nap-col nap-col-1">
            <div class="nap-group">
                <label for="select-product">Product</label>
                <div class="nap-control">
                    <select class="form-control" id="select-product" [(ngModel)]="productId" (ngModelChange)="onProductChange()">
                        <option *ngFor="let product of products" [ngValue]="product.Id">
                            {{product.Name}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="nap-col nap-col-2">
            <div class="nap-group">
                <label for="select-site">Site / Licensee</label>
                <div class="nap-control">
                    <select class="form-control" id="select-site" [(ngModel)]="siteId" (ngModelChange)="onSiteChange()">
                        <option [ngValue]="0">All</option>
                        <optgroup *ngFor="let group of siteGroups" [label]="group.GroupName">
                            <option *ngFor="let site of group.Sites" [ngValue]="site.SiteId">
                                {{site.SiteName}}
                            </option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>
        <div class="nap-col nap-col-3">
            <div class="nap-group">
                <label for="select-currency">Currency</label>
                <div class="nap-control">
                    <select class="form-control" id="select-currency" [(ngModel)]="currencyId">
                        <option *ngFor="let currency of currencies" [ngValue]="currency.Id">
                            {{currency.Name}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="nap-col">
            <button type="button" class="btn btn-primary" (click)="search()">
                Search
            </button>
        </div>
    </div>
</div>
