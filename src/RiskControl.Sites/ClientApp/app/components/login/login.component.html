<div class="login-box">
    <div class="header">
        Risk & Control
    </div>
    <form [formGroup]="form" (ngSubmit)="logIn()" novalidate>
        <div class="form-group">
            <div class="input-group">
                <span class="input-group-addon">
                    <i class="fa fa-user"></i>
                </span>
                <input class="form-control" type="text" maxlength="50" placeholder="Username" formControlName="username" [class.is-invalid]="!username.valid && username.touched">
            </div>
        </div>
        <div class="form-group">
            <div class="input-group">
                <span class="input-group-addon">
                    <i class="fa fa-key"></i>
                </span>
                <input class="form-control" type="password" maxlength="50" placeholder="Password" formControlName="password" [class.is-invalid]="!password.valid && password.touched">
            </div>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-block" [disabled]="!form.valid">LOG IN</button>
        </div>
        <div class="small">Best view in
            <i class="icon-firefox"></i> Firefox 49+
            <i class="icon-chrome"></i> Chrome 54+
        </div>
    </form>
</div>
