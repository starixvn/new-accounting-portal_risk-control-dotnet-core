<nav-menu></nav-menu>
<div class="nap-header">
    <div class="title">
        {{username}} /
        <span class="active">Password</span>
    </div>
</div>
<form class="nap-filter" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="row" *ngIf="message">
        <div class="nap-col">
            <div class="nap-group">
                <label></label>
                <div class="nap-control">
                    <div [class.text-success]="form.valid" [class.text-danger]="!form.valid" role="alert">
                        {{message}}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="nap-col">
            <div class="nap-group">
                <label for="oldPassword">Old Password</label>
                <div class="nap-control">
                    <input type="password" class="form-control" id="oldPassword" formControlName="oldPassword">
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="nap-col">
            <div class="nap-group">
                <label for="newPassword">New Password</label>
                <div class="nap-control">
                    <input type="password" class="form-control" id="newPassword" formControlName="newPassword">
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="nap-col">
            <div class="nap-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="nap-control">
                    <input type="password" class="form-control" id="confirmPassword" formControlName="confirmPassword">
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="nap-col">
            <div class="nap-group">
                <label></label>
                <div class="nap-control">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>
</form>
