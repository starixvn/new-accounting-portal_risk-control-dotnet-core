<div *ngIf="hasNormalMode || hasHistoryMode" class="nap-filter">
  <nap-legend [legendId]="523" [legendTitle]="'Non-Sport Game Statistics Legend'"></nap-legend>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Product</label>
        <div class="nap-control">
          <ngx-dropdown-treeview #productDropdownTreeview [items]="productTreeViewItems"
            [config]="productTreeviewConfig" (selectedChange)="onProductChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>{{isNormalMode ? 'Date' : 'Time period'}}</label>
        <div class="nap-control" [ngSwitch]="isNormalMode">
          <nap-date-picker *ngSwitchCase="true" [(date)]="date" [minDate]="minDate" [maxDate]="maxDate">
          </nap-date-picker>
          <nap-dropdown-select *ngSwitchCase="false" [items]="timePeriodSelectItems" [(value)]="timePeriod"
            (valueChange)="onTimePeriodChange()">
          </nap-dropdown-select>
        </div>
      </div>
    </div>
    <div class="nap-col" *ngIf="!isNormalMode">
      <div class="nap-group">
        <label>From Date</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="startDate" [minDate]="minStartDate" [maxDate]="endDate"
            (dateChange)="onDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col" *ngIf="!isNormalMode">
      <div class="nap-group">
        <label>To Date</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="endDate" [minDate]="startDate" [maxDate]="maxEndDate"
            (dateChange)="onDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>

  </div>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Username</label>
        <div class="nap-control">
          <nap-user-name-suggestion-textbox #userNameSuggestion [roleId]="reportRoleId"
            (complete)="onUserNameSuggestionComplete($event)">
          </nap-user-name-suggestion-textbox>
        </div>
      </div>
    </div>
    <div class="nap-col col-search-exact">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="basermcheckbox" type="checkbox" class="form-check-input" [(ngModel)]="exactMatching"
            (change)="checkExactMatchingValue(exactMatching)">
          Exact Matching
        </label>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Company</label>
        <div class="nap-control">
          <ngx-dropdown-treeview #siteDropdownTreeview [items]="siteTreeViewItems" [config]="siteTreeviewConfig"
            (selectedChange)="onSiteChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Game type</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="gameTypeTreeViewItems" [config]="gameTypeTreeviewConfig"
            (selectedChange)="onGameTypeChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>&nbsp;</label>
        <div class="nap-control">
          <label>&nbsp;</label>
        </div>
      </div>
    </div>
    <div class="nap-col nap-col-exclude-test">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="excludeTestCheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isExcludeTest"
            (change)="excludeTestChangeEvent(isExcludeTest)">
          Exclude test data
        </label>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Total Bets</label>
        <div class="nap-control">
          <div class="col-fixed-60px">
            <nap-dropdown-select [items]="compareTypeSelectItems" [(value)]="totalBetsCompareType"
              (valueChange)="onTotalBetsTypeChange()">
            </nap-dropdown-select>
          </div>
          <div class="col-offset-60px">
            <nap-ngx-numeric-textbox [(ngModel)]="totalBetsValue" [min]="0" [max]="10000000000000" [format]="'0,0'"
              [decimals]="0" [autoCorrect]="true" (valueChange)="totalBetChange($event)">
            </nap-ngx-numeric-textbox>
          </div>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Device</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [config]="deviceTreeviewConfig" [items]="deviceTreeViewItems"
            (selectedChange)="onDeviceChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Show Column</label>
        <div class="nap-control">
          <ngx-dropdown-treeview #columnDropdownTreeview [items]="columnTreeViewItems"
            (selectedChange)="onColumnChange($event)"></ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="viewByIntegerCheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isViewByInteger"
            (change)="viewByIntegerChange(isViewByInteger)">
          View by Integer
        </label>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Game Income</label>
        <div class="nap-control">
          <div class="col-fixed-60px">
            <nap-dropdown-select [items]="compareTypeSelectItems" [(value)]="gameIncomeCompareType"
              (valueChange)="onGameIncomeTypeChange()">
            </nap-dropdown-select>
          </div>
          <div class="col-offset-60px">
            <nap-ngx-numeric-textbox [(ngModel)]="gameIncomeValue" [min]="0" [max]="10000000000000" [format]="'0,0'"
              [decimals]="0" [autoCorrect]="true" (valueChange)="gameIncomeChange($event)">
            </nap-ngx-numeric-textbox>
          </div>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label class="mt-2">Currency</label>
      </div>
    </div>
    <div class="nap-col">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="basermcheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isBaseRM"
            (change)="checkBaseRMValue(isBaseRM)">
          Base RM
        </label>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <div class="nap-control" [ngClass]="{ 'disabledfield': isBaseRM === true}">
          <ngx-dropdown-treeview [config]="currenciesTreeviewConfig" [items]="currenciesTreeViewItems"
            (selectedChange)="onCurrenciesChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col" *ngIf="isNormalMode">
      <div class="nap-group">
        <label>House PT %</label>
        <div class="nap-control">
          <div class="col-fixed-60px">
            <nap-dropdown-select [items]="compareTypeSelectItems" [(value)]="housePTCompareType"
              (valueChange)="onHousePTTypeChange()">
            </nap-dropdown-select>
          </div>
          <div class="col-offset-60px">
            <nap-dropdown-select [items]="housePTSelectItems" [(value)]="housePTValue"
              (valueChange)="onHousePTChange($event)">
            </nap-dropdown-select>
          </div>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Report by</label>
        <div class="nap-control">
          <nap-dropdown-select [items]="reportTypeSelectItems" [value]="selectedReportType"
            (valueChange)="onReportTypeChange($event)">
          </nap-dropdown-select>
        </div>
      </div>
    </div>
    <div class="nap-col" *ngIf="isSelectedTop20Report">
      <nap-dropdown-select [items]="top20RoleSelectItems" [value]="roleId" (valueChange)="onTop20RoleIdChange($event)">
      </nap-dropdown-select>
    </div>
    <div class="nap-col" *ngIf="!isNormalMode && !isYerterdayDataWarehouseReady">
      <div class="text-danger">Yesterday's data is not ready.</div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col col-buttons blocks">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" (click)="onGenerateClick()">
        GENERATE
      </button>
      <button *ngIf="isNormalMode" type="button" class="btn btn-primary" (click)="onDateClick(today)">
        {{today | napMomentFormat}}
      </button>
      <button *ngIf="isNormalMode" type="button" class="btn btn-primary" (click)="onDateClick(yesterday)">
        {{yesterday | napMomentFormat}}
      </button>
      <button *ngIf="hasNormalMode && hasHistoryMode" type="button" class="btn btn-primary" (click)="toggleMode()">
        {{isNormalMode ? 'HISTORY REPORT' : 'BACK'}}
      </button>
      <button type="button" class="btn btn-primary" (click)="onResetClick()">
        Reset Filter
      </button>
    </div>
  </div>
</div>
