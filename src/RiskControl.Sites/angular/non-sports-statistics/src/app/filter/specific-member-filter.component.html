<div class="nap-filter">
  <nap-legend [legendId]="645" [legendTitle]="'Non-Sport Game Statistics Specific Member Legend'"></nap-legend>
  <div class="row">
    <div class="nap-col col-title">
      Search by
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Product</label>
        <div class="nap-control">
          <ngx-dropdown-treeview #productDropdownTreeview [items]="products | napProductTreeview"
            [config]="productTreeviewConfig" (selectedChange)="onProductChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Time period</label>
        <div class="nap-control">
          <nap-dropdown-select [items]="timePeriodSelectItems" [(value)]="timePeriod"
            (valueChange)="onTimePeriodChange()">
          </nap-dropdown-select>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col col-title">
      User search
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Username</label>
        <div class="nap-control">
          <input class="form-control" type="text" [(ngModel)]="username" />
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>From Date</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="startDate" [minDate]="minStartDate" [maxDate]="endDate"
            (dateChange)="onDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>To Date</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="endDate" [minDate]="startDate" [maxDate]="maxEndDate"
            (dateChange)="onDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col nap-col-exclude-test">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="excludeTestCheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isExcludeTest">
          Exclude test data
        </label>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col col-title">
      &nbsp;
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Company</label>
        <div class="nap-control">
          <ngx-dropdown-treeview #siteDropdownTreeview [items]="sites | napSiteTreeview" [config]="siteTreeviewConfig"
          (selectedChange)="onSiteChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label class="mt-2">Currency</label>
      </div>
    </div>
    <div class="nap-col">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="basermcheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isBaseRM">
          Base RM
        </label>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <div class="nap-control" [ngClass]="{ 'disabledfield': isBaseRM === true}">
          <ngx-dropdown-treeview [config]="currenciesTreeviewConfig"
            [items]="currencies | napExcludeTest2:isExcludeTest | ngxTreeview:'currency'"
            (selectedChange)="selectedCurrencies = $event">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Show Column</label>
        <div class="nap-control">
          <ngx-dropdown-treeview #columnDropdownTreeview [items]="columns"></ngx-dropdown-treeview>
        </div>
      </div>
    </div>

    <div class="nap-col">
      <div class="form-check nap-form-checkbox">
        <label class="form-check-label">
          <input name="viewByIntegerCheckbox" type="checkbox" class="form-check-input" [(ngModel)]="isViewByInteger">
          View by Integer
        </label>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col col-title">
      &nbsp;
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Game type</label>
        <div class="nap-control">
          <ngx-dropdown-treeview
            [items]="gameTypes | napExcludeTest:isExcludeTest | napGametypeTreeview:selectedProducts"
            [config]="gameTypeTreeviewConfig" (selectedChange)="onGameTypeChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>Report by</label>
        <div class="nap-control">
          <nap-dropdown-select [items]="reportTypeSelectItems" [value]="selectedReportType"
            (valueChange)="onReportTypeChange($event)">
          </nap-dropdown-select>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="nap-col col-buttons blocks">
      <label>&nbsp;</label>
      <button type="button" class="btn btn-primary" (click)="onGenerateClick()">
        GENERATE
      </button>
    </div>
  </div>
</div>
