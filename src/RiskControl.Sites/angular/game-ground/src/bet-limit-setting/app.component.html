<nap-navbar></nap-navbar>
<div class="container-fluid" style="min-width: 1100px;">
  <div class="nap-header">
    <div class="title">
      <span class="active">Game Round Bet Limit Setting</span>
      <i
        class="nap-icon"
        [ngClass]="{
          'nap-icon-header-collapse': isHideFilter,
          'nap-icon-header-expand': !isHideFilter
        }"
        (click)="showHideFilter()"
        [title]="isHideFilter ? 'Show filter' : 'Hide filter'"
      ></i>
    </div>
  </div>
  <nap-filter
    [hidden]="isHideFilter"
    (valueChange)="generate($event)"
  ></nap-filter>
  <nap-toast></nap-toast>
  <nap-grid [filterModel]="filterModel"></nap-grid>
</div>
<nap-spinner></nap-spinner>
