<nap-navbar></nap-navbar>
<div class="container-fluid mt-2" style="min-width: 1100px;">
  <div class="row mb-2">
    <div class="col-12 col-xs-12 col-md-12">
        <nap-legend [legendId]="351" [legendTitle]="'Dashboard'"></nap-legend>
    </div>
  </div>
  <br/>
  <div class="row">
    <div class="performance-block card col-9 col-sm-9 col-md-9">
      <div class="row card-header">
        PERFORMANCE OF 3RD PRODUCTS
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-6 col-sm-6 col-md-6">
            <div *ngIf="monthlyTurnoverAndNetIncome" class="chart-block">
              <canvas napChart [datasets]="netIncomeDatasets" [labels]="monthLabels" chartType="bar"
                [options]="netIncomeOptions" [colors]="netIncomeChartColors"></canvas>
            </div>
            <br />
            <div *ngIf="monthlyTurnoverAndNetIncome" class="chart-block">
              <canvas napChart [datasets]="turnoverDatasets" [labels]="monthLabels" chartType="bar"
                [options]="turnoverOptions" [colors]="turnoverChartColors"></canvas>
            </div>
          </div>
          <div class="col-6 col-sm-6 col-md-6">
            <div *ngIf="currencyNetIncome" class="chart-block">
              <canvas napChart [datasets]="currencyDatasets" [labels]="currencyLabels" chartType="bar"
                [options]="currencyOptions" [colors]="currencyChartColors"></canvas>
            </div>
            <br />
            <div *ngIf="productTurnover" class="chart-block">
              <canvas napChart [datasets]="productDatasets" [labels]="productLabels" chartType="pie"
                [options]="productOptions"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-3 col-sm-3 col-md-3">
      <div class="card w-100 win-loss-limit-block">
        <div class="card-header">
          Win Loss Limit Monitor
        </div>
        <div *ngIf="winlossLimit" [ngSwitch]="winlossLimit.length > 0" class="card-body">
          <div *ngSwitchCase="true">
            <div class="row">
              <div class="col-4 col-sm-4 col-md-4">
                <label>UserName</label>
              </div>
              <div class="col-2 col-sm-2 col-md-2">
                <label>Currency</label>
              </div>
              <div class="col-4 col-sm-4 col-md-4">
                <label>Product</label>
              </div>
              <div class="col-2 col-sm-2 col-md-2">
                <label>Limit Level</label>
              </div>
            </div>
            <div *ngFor="let item of winlossLimit" class="row mt-1">
              <div class="col-4 col-sm-4 col-md-4">
                {{item.UserName}}
              </div>
              <div class="col-2 col-sm-4 col-md-2">
                {{item.Currency}}
              </div>
              <div class="col-4 col-sm-4 col-md-4">
                {{item.Product}}
              </div>
              <div class="col-2 col-sm-2 col-md-2">
                <i class="fa fa-flag" [ngClass]="{
                'text-orrange': (item.LimitLevel == 1), 
                'text-yellow': (item.LimitLevel == 2),
                'text-red': (item.LimitLevel == 3),
                'text-grey': (item.LimitLevel == 101),
                'text-black': (item.LimitLevel == 102)}"></i>
              </div>
            </div>
          </div>
          <div *ngSwitchCase="false">
            <div class="row text-red font-weight-bold">
              <div class="col-12 col-xs-12 col-md-12">There is no data</div>
            </div>
          </div>
        </div>
      </div>
      <br />
      <div class="card w-100 top-member-winning">
        <div class="card-header">
          Top Members with High Winning (RM)
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-5 col-sm-5 col-md-5">
              <label>UserName</label>
            </div>
            <div class="col-3 col-sm-3 col-md-3">
              <label>Currency</label>
            </div>
            <div class="col-4 col-sm-4 col-md-4 text-right">
              <label>Game Income</label>
            </div>
          </div>
          <div *ngFor="let item of topMemberWinning" class="row mt-1">
            <div class="col-5 col-sm-5 col-md-5">
              {{item.Username}}
            </div>
            <div class="col-3 col-sm-3 col-md-3">
              {{item.Currency}}
            </div>
            <div class="col-4 col-sm-4 col-md-4 text-right" [napIntegerFormat]="item.GameIncome">
            </div>
          </div>
        </div>
      </div>
      <br />
      <div class="card w-100 top-game-winning">
        <div class="card-header">
          Top Game Types with High Winning (RM)
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-5 col-sm-5 col-md-5">
              <label>Game Type</label>
            </div>
            <div class="col-3 col-sm-3 col-md-3">
              <label>Product</label>
            </div>
            <div class="col-4 col-sm-4 col-md-4 text-right">
              <label>Game Income</label>
            </div>
          </div>
          <div *ngFor="let item of topGameTypeWinning" class="row mt-1">
            <div class="col-5 col-sm-5 col-md-5">
              {{item.Bettype}}
            </div>
            <div class="col-3 col-sm-3 col-md-3">
              {{item.Product}}
            </div>
            <div class="col-4 col-sm-4 col-md-4 text-right" [napIntegerFormat]="item.GameIncome">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<nap-spinner></nap-spinner>
