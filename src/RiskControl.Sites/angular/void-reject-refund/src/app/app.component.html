<nap-navbar></nap-navbar>
<div class="container-fluid" style="min-width: 1100px;">
    <div class="nap-header">
        <div class="title">
            Reports /
            <span class="active">Non-Sport Game Void/Reject/Refund </span>
            <i class="nap-icon" [ngClass]="{'nap-icon-header-collapse' : isHideFilter, 'nap-icon-header-expand': !isHideFilter}" (click)="showHideFilter()"
            [title]="isHideFilter ? 'Show filter' : 'Hide filter'"></i>
        </div>
    </div>
    <app-filter [hidden]="isHideFilter" (generated)="generate($event)" (reset)="onReset()"></app-filter>
    <nap-toast></nap-toast>
    <app-grid *ngIf="filterModel" [filterModel]="filterModel"></app-grid>
</div>
<nap-spinner></nap-spinner>
