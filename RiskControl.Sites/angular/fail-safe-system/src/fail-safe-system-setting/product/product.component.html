<ng-template #colgroup>
    <colgroup>
        <col style="width: 100px;"/>
        <col style="width: 350px;"/>
    </colgroup>
</ng-template>
<ng-template #thead>
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Product</th>
      </tr>
    </thead>
</ng-template>
<ng-template #rowItem let-product="product" let-index="index">
    <tr>
        <td class="text-center">{{index}}</td>
        <td class="text-center">{{product}}</td>
    </tr>
  </ng-template>
<div class="modal-header">
    <p class="modal-title">{{title}}</p>
    <button type="button" class="close" aria-label="Close" (click)="closePopup()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div>
        <div class="nap-grid">
          <div style="width: 469px">
            <div class="header">
              <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <ng-template [ngTemplateOutlet]="thead"></ng-template>
              </table>
            </div>
            <div class="body">
              <table class="table-striped mb-0">
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tbody>
                  <ng-container *ngFor="let product of products; index as i">
                    <ng-template [ngTemplateOutlet]="rowItem" [ngTemplateOutletContext]="{ product: product, index: i + 1 }">
                    </ng-template>
                  </ng-container>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
</div>
