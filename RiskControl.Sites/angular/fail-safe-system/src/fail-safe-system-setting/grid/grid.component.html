<ng-template #colgroup>
    <colgroup>
      <col style="width: 60px" />
      <col style="width: 300px" />
      <col style="width: 150px" />
      <col style="width: 150px" />
      <col style="width: 150px" />
      <col style="width: 150px" />
      <col style="width: 100px" />
      <col style="width: 70px" />
      <col style="width: 70px" />
    </colgroup>
  </ng-template>
  <ng-template #thead>
    <thead>
      <tr>
        <th scope="col" rowspan="2">#</th>
        <th scope="col" rowspan="2">Rule title</th>
        <th scope="col" rowspan="2">Product</th>
        <th scope="col" rowspan="2">Number of Members reach Rule</th>
        <th scope="col" colspan="2">Criteria for each Game Type</th>
        <th scope="col" rowspan="2">Send Letstalk notification</th>
        <th scope="col" rowspan="2">Edit</th>
        <th scope="col" rowspan="2">
            Delete
            <div class="form-check">
                <input type="checkbox" class="form-check-input position-static" (change)="checkAllDelete()">
                <span (click)="deleteRule()" class="button-action delete-rule fa fa-trash-o ml-2"></span>
            </div>
        </th>
      </tr>
      <tr>
        <th scope="col">Game Income (RM)</th>
        <th scope="col">Game Payout (%)</th>
      </tr>
    </thead>
  </ng-template>
  <ng-template #rowItem let-item="item" let-index="index">
    <tr>
        <td class="text-center">{{index}}</td>
        <td class="text-center">{{item.ruleTitle}}</td>
        <td class="text-center">
          <a href="#" (click)="showProduct(item.productList, item.ruleTitle)">{{item.productCount}}</a>
        </td>
        <td class="text-center">{{item.ruleMemberLimit}}</td>
        <td class="text-center">{{item.gameIncome}}</td>
        <td class="text-center">{{item.gamePayout}}</td>
        <td class="text-center">
            <input type="checkbox" [disabled]="true" [checked]="item.enableLetstalk"/>
        </td>
        <td class="text-center">
            <span (click)="editRule(item)" class="button-action fa fa-edit"></span>
        </td>
        <td class="text-center">
            <input type="checkbox" [(ngModel)]="item.isDelete"/>
        </td>
    </tr>
  </ng-template>
  <div *ngIf="displayedModels.length > 0" [ngSwitch]="displayedModels.length > 0">
    <div class="nap-grid">
      <div style="width: 1215px">
        <div class="header">
          <table>
            <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
            <ng-template [ngTemplateOutlet]="thead"></ng-template>
          </table>
        </div>
        <div *ngSwitchCase="true" class="body">
          <table class="table-striped mb-0">
            <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
            <tbody>
              <ng-container *ngFor="let item of displayedModels; index as i">
                <ng-template [ngTemplateOutlet]="rowItem" [ngTemplateOutletContext]="{ item: item, index: getIndex(i + 1) }">
                </ng-template>
              </ng-container>
            </tbody>
          </table>
        </div>
        <div *ngSwitchCase="false" class="body stretch">
          <table>
            <tbody>
              <tr>
                <th scope="col" class="no-data" colspan="9">
                  There is no data
                </th>
              </tr>
            </tbody>
          </table>
        </div>
        <div *ngSwitchCase="true" class="footer">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tfoot>
                    <tr>
                        <td colspan="9">
                            <nap-pagination [config]="paginationInstance" (pageChange)="onPageChange()"></nap-pagination>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
      </div>
    </div>
  </div>
