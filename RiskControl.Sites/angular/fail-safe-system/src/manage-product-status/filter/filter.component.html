<div class="nap-filter">
    <div class="row">
      <div class="nap-col">
        <div class="nap-group">
          <label>Product</label>
          <div class="nap-control">
            <ngx-dropdown-treeview [items]="productItems | productTreeview" [config]="itemConfig"
              (selectedChange)="selectedProducts = $event"></ngx-dropdown-treeview>
          </div>
        </div>
      </div>

      <div class="nap-col">
        <button type="button" class="btn btn-primary" (click)="search()">Search</button>
      </div>
    </div>
  </div>
